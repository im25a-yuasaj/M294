<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <section id="salut">
        </section>
    </main>
    <script>
        const section = document.getElementById('salut')
        let salut = section.innerHTML
        console.log(salut)

        const name = prompt("Heisst du?")
        const now = new Date()
        const hour = now.getHours()
        let msg = '';
        if (hour <= 10){
            msg = 'Guten Morgen.'
        } else if (hour <= 16) {
            msg = 'Guten Tag'
        } else {
            msg = 'Gute Nacht'
        }
        salut += `<p>${msg} ${name}</p>`
        section.innerHTML = salut
    </script>
</body>
</html>
