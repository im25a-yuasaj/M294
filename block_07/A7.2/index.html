<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                background-color: lightblue;
            }
            div {
                background-color: white;
                border: 1px black solid;
                margin: 10px 0 10px 0;
            }
            input {
                display: block;
            }
        </style>
    </head>
    <body>
        <h1>Posts von JSONPlaceholder</h1>
        <form name="post">
            <input type="text" name="title">
            <input type="text" name="body">
            <button type="submit">Submit</button>
        </form>
        <div></div>
        <script>
            getData()
            const form = document.forms.post
            form.addEventListener('submit', (e) => {
                e.preventDefault()
                sendData()
            })
            

            async function getData() {
                const body = document.getElementsByTagName('body')[0]
                const response = await fetch('https://jsonplaceholder.typicode.com/posts')
                const result = await response.json()
                for (const user of result) {
                    let div = document.createElement('div')
                    let btn = document.createElement('button')
                    btn.innerText = 'Delete'
                    btn.classList.add('deleteBtn')
                    btn.id = user.id

                    btn.addEventListener('click', () => {
                        deleteData(user.id)
                    })
                    const title = await user.title
                    const userbody = await user.body
                    div.innerHTML += `<h2>${title}</h2><p>${userbody}</p>`
                    div.append(btn)
                    body.appendChild(div)

                }
            }
            async function sendData() {
                const form = document.forms.post
                const title = form.title.value
                const body = form.body.value
                let formData = new FormData()
                formData.append('title', title)
                formData.append('body', body)
                const post = await fetch('https://jsonplaceholder.typicode.com/posts', {
                    method: 'POST',
                    body: formData
                })
                const response = await post.text()
                alert(await response)
            }
            async function deleteData(i) {
                const response = await fetch(`https://jsonplaceholder.typicode.com/posts/${i}`, {
                    method: 'DELETE',
                })

                const text = await response.text()
                alert(text)
            }
        </script>
    </body>
</html>
