<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let array = []
        while (true) {
            input = prompt('type a number:')
            array.push(parseInt(input))
            if (!input){
                array.pop()
                let result = array.reduce((sum, current) => sum + current, 0);
                alert(result)
                break
            }  
        }
    </script>
</body>
</html>
