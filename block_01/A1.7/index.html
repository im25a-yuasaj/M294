<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        number = Math.floor(Math.random() * 100)
        while (true){
            console.log(number)
            guessed = prompt('Guess a number between 1 and 100')
            if (number < guessed){
                alert(`guessed number ${guessed} is too high.`)
            } else if (number > guessed) {
                alert(`guessed number ${guessed} is too low.`)
            } else {
                alert(`you have guessed the number!!!`)
                break
            }
        }
        

    </script>
</body>
</html>
